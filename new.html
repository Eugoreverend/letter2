
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>To My Sunshine</title>

  <!-- SAME CSS FILE -->
  <link rel="stylesheet" href="style.css" />

  <link
    href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Quicksand:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  <!-- Music button -->
  <button id="playBtn">
    Play Music 🎵
  </button>


  <div class="dawn">

    <!-- Sunrise -->
    <div class="sun"></div>

    <!-- Clouds -->
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>


    <!-- Floating light -->
    <div class="particles">

      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>

    </div>


    <!-- Main content -->
    <div class="wrap">

      <h1>
        To My Sunshine ☀️
      </h1>


      <div class="postcard">

        <div class="letter">

          <p>

            <span>To a ray of sunshine,</span>

            <br><br>

          work in progress

            <br><br>

          work in progress

            <br><br>
work in progress

            <br><br>

           work in progress.

            <br><br>
work in progress

            <br><br>

           work in progress

            <br><br>

           work in progress

            <br><br>

            You have.

            <br><br>

            Mine.

            <br><br>

            work in progress

            <br><br>

           work in progress

            <br><br>

            <span class="signature">

              Yours Truly,<br />

              Rod Michael ☀️

            </span>

          </p>

        </div>

      </div>

    </div>

  </div>


  <!-- Music -->
  <audio id="bgMusic" loop>

    <source
      src="Lost in Thoughts.mp3"
      type="audio/mpeg"
    />

    Your browser does not support the audio element.

  </audio>


  <script>

    const playBtn =
      document.getElementById("playBtn");

    const bgMusic =
      document.getElementById("bgMusic");


    playBtn.addEventListener("click", () => {

      bgMusic.play();

      playBtn.textContent = "♪ Playing";

      playBtn.classList.add("playing");

    });

  </script>

</body>

</html>
